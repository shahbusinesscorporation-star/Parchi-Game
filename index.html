<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Parchi Game</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #34495e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }
        input, button {
            width: 80%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }
        button {
            background-color: #2ecc71;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #27ae60;
        }
        .thap-btn {
            background-color: #e74c3c;
            font-size: 20px;
            padding: 15px;
            display: none;
        }
        .thap-btn:hover {
            background-color: #c0392b;
        }
        #gameScreen {
            display: none;
        }
        .notification {
            background: #f1c40f;
            color: #2c3e50;
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: none;
            font-weight: bold;
        }
        .player-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
            text-align: left;
        }
        .player-list li {
            background: #1abc9c;
            padding: 8px 12px;
            margin-bottom: 5px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📜 Multiplayer Parchi Game</h2>

        <!-- Notification Box -->
        <div id="notificationBox" class="notification"></div>

        <!-- Setup Screen -->
        <div id="setupScreen">
            <h3>1. Create Room</h3>
            <input type="text" id="createUsername" placeholder="Apna Name Likhein">
            <button onclick="createRoom()">Create Room</button>

            <hr style="border: 0.5px solid #7f8c8d; margin: 20px 0;">

            <h3>2. Join Room</h3>
            <input type="text" id="joinUsername" placeholder="Apna Name Likhein">
            <input type="text" id="joinRoomCode" placeholder="Room Code Enter Karein">
            <button onclick="joinRoom()" style="background-color: #3498db;">Join Game</button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen">
            <h3 id="roomCodeDisplay" style="color: #f1c40f;">Room Code: </h3>
            
            <h4>Joined Players (<span id="playerCount">0</span>/4):</h4>
            <ul id="playersList" class="player-list"></ul>

            <button id="thapBtn" class="thap-btn" onclick="claimThap()">✋ THAP!</button>
        </div>
    </div>

    <script>
        // Automatic domain socket connection
        const socket = io();

        let currentRoomId = '';
        let myUsername = '';

        // Create Room
        function createRoom() {
            myUsername = document.getElementById('createUsername').value.trim();
            if (!myUsername) {
                alert('Kripya apna naam likhein!');
                return;
            }

            // Generate 6 Digit Code
            currentRoomId = Math.floor(100000 + Math.random() * 900000).toString();
            socket.emit('createRoom', { roomId: currentRoomId, username: myUsername });
        }

        // Join Room
        function joinRoom() {
            myUsername = document.getElementById('joinUsername').value.trim();
            currentRoomId = document.getElementById('joinRoomCode').value.trim();

            if (!myUsername || !currentRoomId) {
                alert('Name aur Room Code dono bharein!');
                return;
            }

            socket.emit('joinRoom', { roomId: currentRoomId, username: myUsername });
        }

        // THAP Action
        function claimThap() {
            socket.emit('claimThapWin', { roomId: currentRoomId, username: myUsername });
        }

        // Helper Notification Display
        function showNotification(msg) {
            const box = document.getElementById('notificationBox');
            box.innerText = msg;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 4000);
        }

        // --- Socket Event Handlers ---

        socket.on('roomCreated', (data) => {
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            
            const code = data.roomId || currentRoomId;
            document.getElementById('roomCodeDisplay').innerText = `Room Code: ${code}`;
            
            updatePlayerList(data.players);
            showNotification('Room ban gaya hai! Code share karein.');
        });

        socket.on('playerJoined', (data) => {
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';

            document.getElementById('roomCodeDisplay').innerText = `Room Code: ${currentRoomId}`;
            updatePlayerList(data.players);
        });

        socket.on('notification', (msg) => {
            showNotification(msg);
        });

        socket.on('errorMsg', (msg) => {
            alert(msg);
        });

        socket.on('gameOver', (data) => {
            alert(`🎉 Game Over!\n${data.message}`);
        });

        function updatePlayerList(players) {
            const list = document.getElementById('playersList');
            list.innerHTML = '';
            if (players && players.length > 0) {
                players.forEach(p => {
                    const li = document.createElement('li');
                    li.innerText = `👤 ${p.username}`;
                    list.appendChild(li);
                });
                document.getElementById('playerCount').innerText = players.length;
                
                // Show THAP Button if 2 or more players join
                if (players.length >= 2) {
                    document.getElementById('thapBtn').style.display = 'inline-block';
                }
            }
        }
    </script>
</body>
</html>
